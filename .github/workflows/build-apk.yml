name: Build GhostGun APK

on:
  workflow_dispatch:
  push:
    paths:
      - "GhostGun_P2P.html"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare web app
        run: |
          npm install
          mkdir -p www
          cp GhostGun_P2P.html www/index.html

      - name: Generate Android project
        run: |
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          def lock_activity(match):
              attrs = re.sub(r'\sandroid:screenOrientation="[^"]*"', "", match.group(1))
              return '<activity' + attrs + ' android:screenOrientation="landscape">'
          updated, count = re.subn(r'<activity\b([^>]*)>', lock_activity, source, count=1)
          if count != 1:
              raise SystemExit("Could not locate the Android main activity in AndroidManifest.xml")
          manifest.write_text(updated)
          PY
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name installer file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/GhostGun-Installer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostGun-Installer
          path: android/app/build/outputs/apk/debug/GhostGun-Installer.apk
          if-no-files-found: error
          retention-days: 14

# Manual artifact recovery: a new commit can be used to trigger a fresh APK build.
